name: Apply final headcount and logo patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-final-headcount-logo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo '' | base64 -d > /tmp/patch_dashboard.py
          python /tmp/patch_dashboard.py
          python -m py_compile app.py
          git diff --check
          git rm .github/workflows/apply-final-headcount-logo.yml
          git rm -f .github/workflows/update-document-headcounts-logo.yml || true
          git add app.py assets/hospkart_logo.jpg
          git commit -m "Use Yes-only headcounts, ISO label, and Hospkart logo"
          git push origin HEAD:main
