name: tests

on:
  pull_request:
  push:
    branches: [main, google-drive-permanent-storage]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest tests -q
