name: Update document headcounts and logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-document-headcounts-logo.yml'

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply only requested dashboard changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, name):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one {name} block, found {text.count(old)}")
              text = text.replace(old, new, 1)

          replace_once(
              'APP_DIR = Path(__file__).resolve().parent\n',
              'APP_DIR = Path(__file__).resolve().parent\nCATEGORY_LABELS = {"ASF ISO": "ISO"}\n\n\ndef category_label(name: str) -> str:\n    return CATEGORY_LABELS.get(name, name)\n',
              'category label setup',
          )

          replace_once(
              '    st.markdown(\'<div class="brand"><div class="brand-icon">VD</div><div><div class="brand-name">Vendor Workspace</div><div class="brand-sub">Documents, organised.</div></div></div>\', unsafe_allow_html=True)\n',
              '    st.image(str(APP_DIR / "assets" / "hospkart_logo.jpg"), width=220)\n    st.markdown(\'<div class="brand"><div><div class="brand-name">Vendor Workspace</div><div class="brand-sub">Documents, organised.</div></div></div>\', unsafe_allow_html=True)\n',
              'sidebar logo',
          )

          old_totals = '''    st.subheader("Document totals by category")
    st.caption("All saved data. Each card shows the total available files in that checklist category; the line underneath shows how many companies have at least one file in that category.")
    for start in range(0, len(DOCUMENT_TYPES), 5):
        category_columns = st.columns(5)
        for column, category in zip(category_columns, DOCUMENT_TYPES[start:start + 5]):
            category_mask = documents.available & documents.types.map(lambda values: category in values)
            document_count = int(category_mask.sum())
            company_count = int(documents.loc[category_mask & documents.company_key.ne(""), "company_key"].nunique())
            column.metric(category, f"{document_count:,}", help="Total available saved files classified in this category.")
            column.caption(f"{company_count:,} companies")
'''
          new_totals = '''    st.subheader("Document headcount by category")
    st.caption("Headcount includes only companies marked Yes for each document category.")
    for start in range(0, len(DOCUMENT_TYPES), 5):
        category_columns = st.columns(5)
        for column, category in zip(category_columns, DOCUMENT_TYPES[start:start + 5]):
            yes_count = int((checklist[category] == "Yes").sum())
            column.metric(category_label(category), f"{yes_count:,}", help="Company headcount where this document category is Yes.")
'''
          replace_once(old_totals, new_totals, 'document category headcount')

          replace_once(
              '        view = filtered.drop(columns=["company_key", "canonical_id"], errors="ignore").copy()\n',
              '        view = filtered.drop(columns=["company_key", "canonical_id"], errors="ignore").copy()\n        view.rename(columns=CATEGORY_LABELS, inplace=True)\n',
              'visible checklist label',
          )

          replace_once(
              '                label = f"{category}  |  {yes_no}  |  {available} file(s)" if category in DOCUMENT_TYPES else f"Other documents  |  {available} file(s)"\n',
              '                display_category = category_label(category)\n                label = f"{display_category}  |  {yes_no}  |  {available} file(s)" if category in DOCUMENT_TYPES else f"Other documents  |  {available} file(s)"\n',
              'company category label',
          )

          replace_once(
              '            fig=go.Figure(go.Bar(x=values,y=DOCUMENT_TYPES,orientation="h",text=values,textposition="outside",cliponaxis=False))\n',
              '            fig=go.Figure(go.Bar(x=values,y=[category_label(t) for t in DOCUMENT_TYPES],orientation="h",text=values,textposition="outside",cliponaxis=False))\n',
              'coverage chart label',
          )

          replace_once(
              '            types=st.multiselect("Document type(s)",DOCUMENT_TYPES,default=doc.types)\n',
              '            types=st.multiselect("Document type(s)",DOCUMENT_TYPES,default=doc.types,format_func=category_label)\n',
              'review category label',
          )

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile app.py
          git diff --check
          git rm .github/workflows/update-document-headcounts-logo.yml
          git add app.py
          git commit -m "Use Yes-only headcounts, ISO label, and Hospkart logo"
          git push origin HEAD:main
