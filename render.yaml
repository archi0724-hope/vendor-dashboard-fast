services:
  - type: web
    name: vendor-dashboard-fast
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1MaiUdP2HHGcx-7lyx2ki_m_D43jJ3yXZ
      - key: GOOGLE_DRIVE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_DRIVE_IMPERSONATE_USER
        sync: false
