services:
  - type: web
    name: vendor-document-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
